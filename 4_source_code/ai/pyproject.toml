[project]
name = "gallery-of-wonders-ai"
version = "0.1.0"
description = "Recommendation microservice for Gallery of Wonders"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "h5py>=3.11",
    "joblib>=1.4",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "pytest>=8.3",
    "httpx>=0.27",
]
